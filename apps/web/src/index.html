    <script>
      (function () {
        try {
          var stored = localStorage.getItem('atelier-theme');
          var mode =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light');
          document.documentElement.setAttribute(
            'data-theme',
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode,
          );
        } catch (e) {}
      })();
    </script>
