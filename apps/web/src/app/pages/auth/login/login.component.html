<div class="auth-page-container">
  <div class="auth-card atelier-card">
    <div class="auth-header">
      <span class="auth-kicker">TEEPHA PATRON PORTAL</span>
      <h1 class="auth-title">Sign In to Your Vault</h1>
      <p class="auth-subtitle">
        Access your orders, active Lagos same-day deliveries, swatch
        reservations, and AI Style Studio tokens.
      </p>
    </div>

    <form (submit)="onLogin($event)" class="auth-form">
      <div class="form-group">
        <label for="identifier">Phone Number or Email</label>
        <input
          id="identifier"
          type="text"
          [(ngModel)]="identifier"
          name="identifier"
          required
          placeholder="e.g. +234 803 987 6543 or patron@domain.com"
          class="luxe-input"
        />
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="passcode">Access Passcode or SMS OTP</label>
          <a routerLink="/login" class="forgot-link">Request One-Time Code</a>
        </div>
        <input
          id="passcode"
          type="password"
          [(ngModel)]="passcode"
          name="passcode"
          required
          placeholder="••••••••"
          class="luxe-input"
        />
      </div>

      <button type="submit" class="btn-primary full-btn">
        Sign In to Teepha →
      </button>
    </form>

    <div class="divider-row">
      <span class="divider-line"></span>
      <span class="divider-text">OR CONTINUE WITH</span>
      <span class="divider-line"></span>
    </div>

    <div class="social-login-grid">
      <button
        type="button"
        class="btn-secondary social-btn google-full-btn"
        (click)="onSocialLogin('google')"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"
          />
        </svg>
        Continue with Google
      </button>
    </div>

    <div class="auth-footer">
      <span>New to Teepha?</span>
      <a routerLink="/signup" class="signup-link"
        >Create Customer Account (Receive 3 AI Tokens) →</a
      >
    </div>
  </div>
</div>
